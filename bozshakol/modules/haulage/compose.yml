# Модуль «транспорт и диспетчеризация» (участник №2). Подключается из bozshakol/compose.yml.
services:
  bz-haulage:
    build:
      context: ../..
      dockerfile: modules/haulage/Dockerfile
    image: bozshakol/haulage:local
    restart: unless-stopped
    mem_limit: 128m
    environment:
      MQTT_HOST: mosquitto
      DITTO_URL: http://ditto-nginx:80
      DITTO_PASSWORD: ${DITTO_PASSWORD}
      SIM_SPEEDUP: ${SIM_SPEEDUP:-10}
    depends_on:
      bz-setup:
        condition: service_completed_successfully
