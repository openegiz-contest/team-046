# Модуль «переработка и энергия» (участник №4). Подключается из bozshakol/compose.yml.
services:
  bz-processing:
    build:
      context: ../..
      dockerfile: modules/processing/Dockerfile
    image: bozshakol/processing:local
    restart: unless-stopped
    mem_limit: 128m
    environment:
      MQTT_HOST: mosquitto
      DITTO_URL: http://ditto-nginx:80
      DITTO_PASSWORD: ${DITTO_PASSWORD}
      SIM_SPEEDUP: ${SIM_SPEEDUP:-10}
    depends_on:
      bz-setup:
        condition: service_completed_successfully
